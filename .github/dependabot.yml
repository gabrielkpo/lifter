version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits titles, so the PR title check passes; one grouped PR per week for
    # version updates, while a security update comes as its own PR, to merge first
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # typescript-eslint does not support TypeScript 7 yet, and ESLint 10 and @types/node 26 came in
    # the same group: their majors wait until it does (#17, closed). Minor and patch updates
    # still come.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      web:
        applies-to: version-updates
        patterns: ["*"]
  # The Vercel CLI the Deploy workflow installs from its lockfile
  - package-ecosystem: npm
    directory: /ops/deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
