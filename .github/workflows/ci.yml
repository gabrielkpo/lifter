name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Third-party actions are pinned by commit with their version in a comment; Dependabot bumps
# the pins (github-actions ecosystem).
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18  # the hosted database's major version (Neon)
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database server; the tests create and drop their own database
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.7"
      - name: Install
        run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on the GitHub runner image
      - run: shellcheck --severity=warning ops/*.sh
  dependency-review:
    # A pull request that adds a dependency with a known high or critical vulnerability fails.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # GHSA-x8mw-p69m-v3mx: @fastify/busboy 2.x (multipart parsing DoS), pulled by undici 5
          # inside the Vercel CLI 62 of ops/deploy, with no patched 2.x. That CLI only parses the
          # Vercel API's answers in the deploy job, so the DoS does not apply; it goes away with
          # the CLI's next major, followed by Dependabot.
          allow-ghsas: GHSA-x8mw-p69m-v3mx
