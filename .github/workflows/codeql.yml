name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # weekly, Monday 05:00 UTC
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Code scanning is unavailable on free private repos; it runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # The API and the agents (Python), and the app with its server-side proxy (TypeScript).
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4
