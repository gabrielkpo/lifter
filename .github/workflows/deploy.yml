name: Deploy
# Production follows the versions, not every merge: merging release-please's pull request
# publishes vX.Y.Z and calls this workflow (release-please.yml). It also runs by hand
# ("Run workflow") to redeploy the current main, e.g. after a failed deployment.
# Order: the database first (new code may need its tables), then the API, then the app (the
# app must never call an endpoint the API does not have yet), then a check of the live API.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# The jobs below hold the production secrets: their actions are pinned by commit, like every
# workflow's, they restore no cache another workflow could have written, install only what they
# run (from the locks: uv.lock, ops/deploy/package-lock.json), and keep no token after checkout.
# One deployment at a time; a second one waits instead of racing on the database.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets of the "deploy" environment, readable from main only (not "Production": Vercel
    # writes its own deployments there).
    environment: deploy
    steps:
      # Production is deployed from main only. The environment's branch rule already refuses
      # another ref; this fails the run in the open too, rather than skipping it in green.
      - name: From main only
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy runs from main only, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.7"
          enable-cache: false  # nothing a CI run saved is installed next to the owner URL
      - name: Install (the package and dbt, no development tools)
        run: uv sync --locked --no-dev --extra transform
      # Neon keeps 6 hours of history (instant restore) and the Mac backs it up daily; no dump
      # here: the repository is public and an artifact would hold the athlete's data.
      - name: Migrate the hosted database
        run: uv run lifter migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_OWNER_URL }}
      - name: Data tests on the hosted database
        run: uv run lifter data-test
        env:
          DATABASE_URL: ${{ secrets.NEON_OWNER_URL }}

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Vercel CLI from its lockfile
        run: npm ci --prefix ops/deploy --ignore-scripts --no-audit --no-fund
      - name: Deploy the API (Vercel project lifter-api)
        run: ops/deploy/node_modules/.bin/vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Vercel CLI from its lockfile
        run: npm ci --prefix ops/deploy --ignore-scripts --no-audit --no-fund
      # From the repository root: the project's own root directory (web/) is set on Vercel.
      # The CLI prints the deployment's URL on stdout: the check below calls it.
      - name: Deploy the app (Vercel project lifter)
        id: deploy
        run: |
          url=$(ops/deploy/node_modules/.bin/vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}

  check:
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deploy
    steps:
      # The app never answers 200 to a caller with no session: its own sign-in (or the
      # platform's protection) stands in front of every page and every /api call.
      - name: Check the app is closed without a session
        run: |
          case "$APP_URL" in https://*) ;; *) echo "::error::no app URL: $APP_URL"; exit 1 ;; esac
          for path in / /api/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 5 \
              "$APP_URL$path")
            echo "$path: $code"
            if [ "$code" = 200 ]; then echo "::error::$path answers 200 without a session"; exit 1; fi
          done
        env:
          APP_URL: ${{ needs.deploy-web.outputs.url }}
      # The live API answers its token through Vercel's protection: /status and /profile.
      - name: Check the live API
        run: |
          for path in status profile; do
            # A cold start may answer 502/504 once: curl retries those, 30 s at most each.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 4 --retry-delay 5 \
              -H "Authorization: Bearer $LIFTER_API_TOKEN" \
              -H "x-vercel-protection-bypass: $LIFTER_API_BYPASS" \
              "$LIFTER_API_URL/$path")
            echo "/$path: $code"
            test "$code" = 200
          done
        env:
          LIFTER_API_URL: ${{ vars.LIFTER_API_URL }}
          LIFTER_API_TOKEN: ${{ secrets.LIFTER_API_TOKEN }}
          LIFTER_API_BYPASS: ${{ secrets.LIFTER_API_BYPASS }}
