name: Release
on:
  push:
    branches: [main]
# One run at a time: two quick merges must not race on the same release pull request.
concurrency:
  group: release-please
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflow, so the required checks
          # would never run on the release PR. RELEASE_PLEASE_TOKEN is a fine-grained
          # PAT (contents + pull requests: read/write on this repo only). No fallback: a
          # missing or expired token fails this job instead of opening an unchecked PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Production follows the versions: a merged release pull request (a new vX.Y.Z) deploys,
  # a plain merge does not (deploy.yml).
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
