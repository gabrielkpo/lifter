[project]
name = "lifter"
version = "0.1.0"
description = "Training coach agent on Garmin data, with human approval before any write."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lifter = "lifter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
