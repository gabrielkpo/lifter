[project]
name = "lifter"
version = "0.9.0"
description = "CrossFit coach agent on Garmin data: each change the coach makes quotes the athlete, is traced and can be undone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Kpodoh" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    # Imported by the API and the coach directly, not only through langchain-mistralai.
    "httpx>=0.28.1",
    "langchain-core>=1.7.7",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.20",
    # The 2.x client (streamable_http_client, MCPError) and its httpx2 transport.
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/gabrielkpo/lifter"
Repository = "https://github.com/gabrielkpo/lifter"
Changelog = "https://github.com/gabrielkpo/lifter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# For whoever migrates or runs the data tests (the owner, the tests). The API and the scheduled
# sync never import dbt.
transform = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
]

[project.scripts]
lifter = "lifter.cli:main"
lifter-api = "lifter.api.server:main"

[dependency-groups]
dev = [
    "lifter[transform]",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# DTZ: a date or time without a time zone (the athlete's day is config.today()).
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# Baseline: the modules that had type errors when the check was added (most of them
# `fetchone()[0]` on an optional row). New modules are checked; this list only shrinks.
[[tool.mypy.overrides]]
module = [
    "lifter.agents.audit",
    "lifter.agents.coach",
    "lifter.agents.guardrail",
    "lifter.agents.planner",
    "lifter.agents.tools",
    "lifter.agents.week",
    "lifter.api.app",
    "lifter.api.conversation",
    "lifter.bench.conversation",
    "lifter.bench.runner",
    "lifter.bench.scenario",
    "lifter.cli",
    "lifter.config",
    "lifter.conversation",
    "lifter.db",
    "lifter.domain",
    "lifter.garmin",
    "lifter.operations",
    "lifter.program",
    "lifter.sync",
    "lifter.synthetic",]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
