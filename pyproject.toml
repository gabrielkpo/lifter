[project]
name = "lifter"
version = "0.6.0"
description = "CrossFit coach agent on Garmin data, with human approval before any change."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.15",
    "mcp>=1.9",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# For whoever migrates or runs the data tests (the owner, the tests). The API and the scheduled
# sync never import dbt.
transform = [
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
]

[project.scripts]
lifter = "lifter.cli:main"
lifter-api = "lifter.api.server:main"

[dependency-groups]
dev = [
    "lifter[transform]",
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifter"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
